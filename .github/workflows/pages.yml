name: ci

on:
  push:
    branches: [main]
  # Required. Without this the checks never run on a PR, so a branch ruleset
  # that requires `test` blocks every PR forever waiting for a report that
  # cannot arrive.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      # Install from the same file the dev container bakes in, so CI and the
      # container cannot drift into testing different environments.
      - run: pip install -r pipeline/requirements.txt
      # The DR4-readiness invariant is enforced here, not by discipline:
      # no Gaia release name may leak outside catasterism.release.
      - run: python -m pytest -q
        working-directory: pipeline

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: client
      - run: bun run typecheck
        working-directory: client
      - run: bun run build
        working-directory: client
      - uses: actions/upload-pages-artifact@v5
        with: { path: client/dist }

  # Only from main. A PR must be checked, never deployed.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
